services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: isp-tracker-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-isp_tracker} 
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tracker_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-isp_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: isp-tracker-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-isp_tracker}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ENVIRONMENT: ${ENVIRONMENT:-production}
      TRACCAR_URL: ${TRACCAR_URL:-http://traccar:8082}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - tracker_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: isp-tracker-dashboard
    ports:
      - "5173:80"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - tracker_network
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      TRACCAR_URL: http://traccar:8082

  # Traccar (GPS Tracking Engine)
  traccar:
    image: traccar/traccar:latest
    container_name: isp-tracker-traccar
    ports:
      - "8082:8082"
      - "5005:5005"
      - "5055:5055"
      - "5067:5067"
      - "6046:6046"
    volumes:
      - traccar_data:/opt/traccar/data
      - traccar_conf:/opt/traccar/conf
    networks:
      - tracker_network
    environment:
      - database.driver=org.postgresql.Driver
      - database.url=jdbc:postgresql://postgres:5432/${DB_NAME:-isp_tracker}
      - database.user=${DB_USER}
      - database.password=${DB_PASSWORD}

volumes:
  postgres_data:
    driver: local
  traccar_data:
    driver: local
  traccar_conf:
    driver: local

networks:
  tracker_network:
    driver: bridge